<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Finance App</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <h1>Finance App</h1>
  <form id="form">
    <div class="row">
      <select id="market"><option value="IN">India</option><option value="US">US</option></select>
      <input id="ticker" placeholder="e.g. RELIANCE, TCS, AAPL, VOO" autocomplete="off" required>
    </div>
    <div class="row">
      <select id="risk">
        <option value="low">Low risk</option>
        <option value="medium" selected>Medium risk</option>
        <option value="high">High risk</option>
      </select>
      <button type="submit">Research</button>
    </div>
  </form>
  <div id="out"></div>
  <p class="foot">Education only, not personal investment advice. <a href="options.html" target="_blank">AI settings</a></p>
  <script type="module" src="popup.js"></script>
</body>
</html>
